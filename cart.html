<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart — ShionHouse</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    .cart-table { background: #fff; border-radius: 6px; border: 1px solid var(--clr-border); overflow: hidden; }
    .cart-row { display: grid; grid-template-columns: 80px 1fr auto auto auto; gap: 24px; align-items: center; padding: 20px 24px; border-bottom: 1px solid var(--clr-border); }
    .cart-row:last-child { border-bottom: none; }
    .cart-thumb { width: 80px; height: 80px; border-radius: 4px; background: var(--clr-accent2); display:flex; align-items:center; justify-content:center; font-size:36px; flex-shrink:0; }
    .cart-item-name { font-family: var(--ff-display); font-size: 18px; font-weight: 400; }
    .cart-item-cat { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--clr-accent); margin-bottom: 4px; }
    .qty-control { display: flex; align-items: center; gap: 0; border: 1px solid var(--clr-border); border-radius: 4px; overflow: hidden; }
    .qty-btn { width: 32px; height: 32px; background: none; border: none; cursor: pointer; font-size: 16px; color: var(--clr-dark); transition: background .2s; }
    .qty-btn:hover { background: var(--clr-bg); }
    .qty-num { width: 40px; text-align: center; font-size: 14px; font-weight: 500; border: none; outline: none; background: none; }
    .remove-btn { background: none; border: none; cursor: pointer; color: #bbb; font-size: 18px; transition: color .2s; padding: 4px; }
    .remove-btn:hover { color: #c0392b; }
    .cart-summary { background: #fff; border-radius: 6px; border: 1px solid var(--clr-border); padding: 28px; position: sticky; top: 90px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; color: var(--clr-mid); }
    .summary-total { display: flex; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--clr-border); font-family: var(--ff-display); font-size: 22px; font-weight: 600; }
    .empty-cart { text-align: center; padding: 80px 40px; }
    .empty-cart-icon { font-size: 72px; margin-bottom: 20px; }
    .empty-cart h3 { font-family: var(--ff-display); font-size: 32px; font-weight: 400; margin-bottom: 12px; }
    .empty-cart p { color: var(--clr-mid); margin-bottom: 28px; }
  </style>
</head>
<body>

  <div class="topbar">
    🚚 Free shipping on orders over <span>$60</span> &nbsp;|&nbsp; Use code <span>SHION20</span> for 20% off
  </div>

  <nav class="site-nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">Shion<span>House</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Shop</a></li>
        <li><a href="products.html#new">New Arrivals</a></li>
        <li><a href="#">About</a></li>
      </ul>
      <div class="nav-icons">
        <button class="nav-icon-btn" id="searchToggle"><i class="bi bi-search"></i></button>
        <button class="nav-icon-btn"><i class="bi bi-heart"></i></button>
        <a href="cart.html" class="nav-icon-btn">
          <i class="bi bi-bag"></i>
          <span class="cart-badge">0</span>
        </a>
      </div>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
      <a href="cart.html">Cart</a>
    </div>
  </nav>

  <!-- Page Header -->
  <div style="background:var(--clr-dark); padding:60px 0; text-align:center;">
    <div class="container">
      <span style="font-size:11px; letter-spacing:.25em; text-transform:uppercase; color:var(--clr-accent); display:block; margin-bottom:12px;">Your</span>
      <h1 style="font-family:var(--ff-display); font-size:clamp(36px,5vw,64px); font-weight:300; color:#fff;">
        Shopping <em style="font-style:italic; color:var(--clr-accent);">Cart</em>
      </h1>
      <p style="color:rgba(255,255,255,0.5); margin-top:12px; font-size:14px;">
        <a href="index.html" style="color:rgba(255,255,255,0.4);">Home</a>
        &nbsp;/&nbsp; Cart
      </p>
    </div>
  </div>

  <!-- Cart Content -->
  <section style="padding: 72px 0; background: var(--clr-bg);">
    <div class="container">
      <div class="row g-4" id="cartView">
        <!-- Injected by JS -->
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div style="border-top:1px solid rgba(255,255,255,0.08);">
      <div class="container">
        <div class="footer-bottom">
          <span>© 2025 ShionHouse. All rights reserved.</span>
          <a href="index.html" style="color:var(--clr-accent);">← Continue Shopping</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
  <script>
    /* ── Cart Page Renderer ── */
    function renderCart() {
      const container = document.getElementById('cartView');
      const cart = CartManager.get();

      if (!cart.length) {
        container.innerHTML = `
          <div class="col-12">
            <div class="empty-cart">
              <div class="empty-cart-icon">🛍️</div>
              <h3>Your cart is empty</h3>
              <p>Looks like you haven't added anything yet. Let's fix that.</p>
              <a href="products.html" class="btn-primary" style="display:inline-flex; gap:8px; align-items:center;">
                Browse Products <i class="bi bi-arrow-right"></i>
              </a>
            </div>
          </div>`;
        return;
      }

      const itemsHTML = cart.map(item => `
        <div class="cart-row" data-id="${item.id}">
          <div class="cart-thumb">${item.emoji}</div>
          <div>
            <div class="cart-item-cat">${item.category}</div>
            <div class="cart-item-name">${item.name}</div>
          </div>
          <div class="qty-control">
            <button class="qty-btn" onclick="changeQty('${item.id}', ${item.qty - 1})">−</button>
            <input class="qty-num" type="number" value="${item.qty}" min="1" onchange="changeQty('${item.id}', this.value)" />
            <button class="qty-btn" onclick="changeQty('${item.id}', ${item.qty + 1})">+</button>
          </div>
          <div style="font-family:var(--ff-display); font-size:18px; font-weight:600; min-width:80px; text-align:right;">
            $${(item.price * item.qty).toFixed(2)}
          </div>
          <button class="remove-btn" onclick="removeItem('${item.id}')" title="Remove">✕</button>
        </div>`).join('');

      const subtotal = parseFloat(CartManager.total());
      const shipping = subtotal >= 60 ? 0 : 8.99;
      const total = (subtotal + shipping).toFixed(2);

      container.innerHTML = `
        <div class="col-lg-8">
          <div class="cart-table">${itemsHTML}</div>
          <div style="margin-top:16px;">
            <a href="products.html" style="font-size:13px; color:var(--clr-mid); letter-spacing:.08em; text-transform:uppercase; display:inline-flex; align-items:center; gap:6px;">
              ← Continue Shopping
            </a>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="cart-summary">
            <h5 style="font-family:var(--ff-display); font-size:22px; font-weight:400; margin-bottom:24px;">Order Summary</h5>
            <div class="summary-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
            <div class="summary-row"><span>Shipping</span><span>${shipping === 0 ? '<span style="color:green">Free</span>' : '$' + shipping.toFixed(2)}</span></div>
            ${shipping > 0 ? `<p style="font-size:12px; color:var(--clr-accent); margin-bottom:16px;">Add $${(60 - subtotal).toFixed(2)} more for free shipping</p>` : ''}
            <div class="summary-total"><span>Total</span><span>$${total}</span></div>
            <div style="margin-top:28px; display:flex; flex-direction:column; gap:12px;">
              <button class="btn-primary" style="width:100%; justify-content:center;">
                Checkout <i class="bi bi-arrow-right"></i>
              </button>
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:center; font-size:11px; color:rgba(0,0,0,0.4); letter-spacing:.05em;">
                🔒 Secure checkout &nbsp; · &nbsp; 🔄 30-day returns
              </div>
            </div>
          </div>
        </div>`;
    }

    function changeQty(id, qty) {
      qty = parseInt(qty);
      if (qty < 1) { removeItem(id); return; }
      CartManager.updateQty(id, qty);
      updateCartBadge();
      renderCart();
    }

    function removeItem(id) {
      CartManager.remove(id);
      updateCartBadge();
      renderCart();
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
